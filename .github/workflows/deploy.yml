name: Flask CI/CD Deployment Pipeline

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::578273199481:role/github-actions-ecr-ec2-deploy-role
          aws-region: eu-west-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: flask-cicd-app
          IMAGE_TAG: latest
        run: |
          docker build -f Docker/Dockerfile -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Deploy to EC2 via AWS Systems Manager (SSM)
        run: |
          # Fetch the token directly inside the GitHub Runner
          ECR_TOKEN=$(aws ecr get-login-password --region eu-west-1)
          
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceids,Values=i-0eafb72d55f61da97" \
            --comment "Deploy latest Docker container via direct token" \
            --parameters "commands=[
              \"echo '$ECR_TOKEN' | docker login --username AWS --password-stdin 578273199481.dkr.ecr.eu-west-1.amazonaws.com\",
              \"docker pull 578273199481.dkr.ecr.eu-west-1.amazonaws.com/flask-cicd-app:latest\",
              \"docker stop flask-app || true\",
              \"docker rm flask-app || true\",
              \"docker run -d -p 5000:5000 --name flask-app 578273199481.dkr.ecr.eu-west-1.amazonaws.com/flask-cicd-app:latest\"
            ]" \
            --region eu-west-1
